version: 2
updates:
  # Poetry is detected from poetry.lock; dev tools in [dependency-groups] are bumped too.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
