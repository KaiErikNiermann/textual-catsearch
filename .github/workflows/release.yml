# Cut a release from a tag.
#
# Building the distributions (the Python wheel and sdist, and the npm tarball of js/) and
# attaching them to a GitHub release needs nothing but the repository, so it always runs.
# Publishing to PyPI and npm uses trusted publishing; each job is off until its repository
# variable says the publisher exists, so a release never fails on a registry not set up.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      npm_prerelease:
        description: "Publish <version>-ci.<run> to npm under the ci dist-tag (latest is untouched)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    # A tag is not a licence to skip the gates: the full pre-push gate, on the tagged commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The gate runs the TypeScript port's checks too, and its scripts are .ts run by node.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: pipx install poetry
      - run: poetry install
      - run: npm install --global pnpm@10 jscpd@4
      # The e2e suite runs in the e2e job below, in Playwright's image.
      - run: scripts/checks.sh
        env:
          CATSEARCH_SKIP_E2E: "1"
      - name: the tag matches the versions in pyproject and js/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          python="$(poetry version --short)"
          js="$(node -p 'require("./js/package.json").version')"
          echo "tag ${tagged}, pyproject ${python}, js/package.json ${js}"
          test "${tagged}" = "${python}"
          test "${tagged}" = "${js}"

  e2e:
    # As in ci.yml: the browsers come with the image, not from the runner's apt mirror.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      HOME: /root
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e

  build:
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: pipx install poetry
      - run: poetry build
      - name: the wheel installs and imports
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import textual_catsearch, textual_catsearch.widgets"
      # The npm tarball goes in its own directory and artifact: the PyPI upload takes every file
      # in `distributions` and would reject a .tgz.
      - run: npm install --global pnpm@10
      - run: pnpm -C js install --frozen-lockfile
      - run: pnpm -C js build
      - name: pack the npm tarball, with the licence beside it
        run: |
          cp LICENSE js/LICENSE
          mkdir npm-dist
          pnpm -C js pack --pack-destination "${PWD}/npm-dist"
      - name: the tarball installs and imports
        run: |
          mkdir /tmp/npm-smoke
          cd /tmp/npm-smoke
          npm init --yes >/dev/null
          npm install --silent "${GITHUB_WORKSPACE}"/npm-dist/*.tgz
          node --input-type=module -e 'import { Schema, parse } from "catsearch"; console.log(typeof Schema, typeof parse)'
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: npm-dist/

  github-release:
    needs: build
    # A manual dispatch is a dry run of verify + build; with no tag there is nothing to name
    # a release after.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist/
      # Notes come from .github/release-notes/<tag>.md; GitHub's generated list follows them.
      - uses: actions/checkout@v7
        with:
          path: src
          sparse-checkout: .github/release-notes
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: src/.github/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true

  pypi:
    # Skipped until trusted publishing exists: a `pypi` environment on this repository, a
    # matching publisher on PyPI, and the repository variable PYPI_TRUSTED_PUBLISHING=true.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    # Trusted publishing: npmjs.com trusts this workflow file in the `npm` environment, and the
    # repository variable NPM_TRUSTED_PUBLISHING=true turns the job on. A tag publishes the
    # tarball the release attached, as `latest`. A manual run with npm_prerelease publishes
    # this commit as <version>-ci.<run>.<attempt> under the `ci` dist-tag, which tests the
    # whole path without moving `latest`.
    needs: build
    if: >-
      vars.NPM_TRUSTED_PUBLISHING == 'true'
      && (startsWith(github.ref, 'refs/tags/v') || inputs.npm_prerelease)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-dist/
      - name: publish the release tarball as latest
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish npm-dist/*.tgz
      - name: publish a prerelease under the ci dist-tag
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          mkdir unpacked
          tar -xzf npm-dist/*.tgz -C unpacked
          cd unpacked/package
          base="$(node -p 'require("./package.json").version')"
          npm version --no-git-tag-version "${base}-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          npm publish --tag ci
