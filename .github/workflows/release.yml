# Cut a release from a tag.
#
# Building the distributions and attaching them to a GitHub release needs nothing but the
# repository, so it always runs. Publishing to PyPI needs a trusted publisher that does not
# exist yet, so that job detects its own absence and skips rather than failing every release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # A tag is not a licence to skip the gates: the full pre-push gate, on the tagged commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pipx install poetry
      - run: poetry install
      - run: npm install --global jscpd@4
      - run: scripts/checks.sh
      - name: the tag matches the version in pyproject
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(poetry version --short)"
          echo "tag ${tagged}, pyproject ${declared}"
          test "${tagged}" = "${declared}"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pipx install poetry
      - run: poetry build
      - name: the wheel installs and imports
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import textual_catsearch, textual_catsearch.widgets"
      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/

  github-release:
    needs: build
    # A manual dispatch is a dry run of verify + build; with no tag there is nothing to name
    # a release after.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    # Skipped until trusted publishing exists: a `pypi` environment on this repository, a
    # matching publisher on PyPI, and the repository variable PYPI_TRUSTED_PUBLISHING=true.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
