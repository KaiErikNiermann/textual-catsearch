<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>catsearch search bar</title>
    <!-- A remembered theme, before first paint (theme.ts STORAGE_KEY), so a reload never flashes. -->
    <script>
      try {
        const theme = localStorage.getItem("catsearch-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <div class="masthead">
          <h1 class="title">Search the catalogue</h1>
          <button id="theme" type="button" class="icon-button"></button>
        </div>
        <p class="lede">
          Type words to search titles, or <code>field:value</code> to filter: <code>kind:</code>, <code>year:</code>, <code>genre:</code>, <code>cast:</code>, <code>is:</code>. Tab takes a completion and Tab again walks to the next; on a phone, tap one.
        </p>
      </header>

      <div class="search">
        <div
          id="query"
          class="query"
          role="combobox"
          aria-label="Search"
          aria-autocomplete="list"
          aria-controls="suggestions"
          aria-expanded="false"
          aria-multiline="false"
          spellcheck="false"
          autocapitalize="off"
          autocorrect="off"
          enterkeyhint="search"
          tabindex="0"
          data-placeholder="Search, or type a field…"
        ></div>
        <ul id="suggestions" class="suggestions" role="listbox" aria-label="Completions" hidden></ul>
      </div>

      <div class="status">
        <output id="count" class="count" aria-live="polite"></output>
        <p id="notice" class="notice" role="status" hidden></p>
      </div>

      <div class="examples" aria-label="Example queries">
        <button type="button" class="example" data-example="kind:movie year:>2015">kind:movie year:&gt;2015</button>
        <button type="button" class="example" data-example="genre:sci-fi -is:watched">genre:sci-fi -is:watched</button>
        <button type="button" class="example" data-example="(kind:tv OR kind:game) is:favourite">(kind:tv OR kind:game) is:favourite</button>
        <button type="button" class="example" data-example='cast:"chalamet" dune'>cast:"chalamet" dune</button>
      </div>

      <ol id="results" class="results"></ol>
    </main>
  </body>
</html>
